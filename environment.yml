# NOTE: no `name:` field on purpose.
# The Dockerfile installs with an explicit `micromamba install -n base -f environment.yml`,
# so the target env is chosen there. Omitting `name:` means a local
# `conda env create -f environment.yml` errors asking for -n/-p rather than
# silently installing into the caller's base environment.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10,<3.13
  - setuptools >=61
  - numpy >=1.26
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - h5py
  - pysam
  - pybedtools
  - pybigwig
  # External binaries the library and test suite shell out to. pybedtools
  # supplies `bedtools`; everything below was previously undeclared.
  # The full set is the result of grepping the library for invoked commands:
  #   htslib                -> bgzip, tabix       (TabixBedReader/Writer)
  #   ucsc-bedtobigbed      -> bedToBigBed        (BigBedWriter)
  #   ucsc-bigbedinfo       -> bigBedInfo         (BigBedReader)
  #   ucsc-bigbedtobed      -> bigBedToBed        (BigBedReader slicing)
  #   ucsc-bigwigtowig      -> bigWigToWig        (BigWigReader slicing)
  #   ucsc-bedgraphtobigwig -> bedGraphToBigWig   (BigWigWriter)
  # Their absence accounted for 33 test failures.
  - htslib
  - samtools
  - ucsc-bedtobigbed
  - ucsc-bigbedinfo
  - ucsc-bigbedtobed
  - ucsc-bigwigtowig
  - ucsc-bedgraphtobigwig
  - bx-python
  - smart_open
  - dacite
  - intervaltree
  - tqdm
  - joblib
  - numba
  - requests
  - pyyaml
  - pyliftover
  - statsmodels
  - sparse
  - pytorch-cpu
  - cython >=3.0
  - c-compiler
  - awscli
  - s5cmd
  - pytest
  - pip
  - pip:
    # Repinned from v2.10.1, which no longer exists on the remote (the tag was
    # deleted; `git ls-remote --tags` shows v2.9.1 -> v2.11.0 with no v2.10.x).
    # That dead pin made this file — and `docker build` — fail outright.
    # v2.13.3 verified: tag dereferences to f6a936b, whose pyproject declares 2.13.3.
    - git+https://github.com/nboley/fragments_h5.git@v2.13.3
    - git+https://github.com/nboley/datamanifest.git@v1.3.0
